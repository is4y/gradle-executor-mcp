# .github/workflows/release.yml
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Tag pushes can't be branch-filtered in `on:`, so gate the release on the
  # tagged commit actually being contained in main.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit not on main; refusing to release."
            exit 1
          fi

  test:
    needs: verify-tag
    uses: ./.github/workflows/test.yml

  publish:
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write   # required for cache-to: type=gha (Actions cache API)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
